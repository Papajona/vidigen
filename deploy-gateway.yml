name: Deploy gateway to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'Dockerfile'
      - 'supabase_schema.sql'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1          # change to whichever region is closest to your users
  SERVICE_NAME: vidigen-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # required for keyless auth via Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation, not a downloaded service-account JSON key — a long-
      # lived key file is a real, common source of leaked-credential incidents; this avoids
      # that class of risk entirely. Set this up once in GCP (see the deploy notes) rather
      # than pasting a key into GitHub secrets.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/vidigen/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/vidigen/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/vidigen/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --timeout=3600 \
            --max-instances=1 \
            --min-instances=1 \
            --memory=2Gi \
            --cpu=2 \
            --set-env-vars="VIDIGEN_ENVIRONMENT=production"
        # --max-instances=1 is deliberate, not a resource-saving default — see the note in
        # DEPLOY_GCP.md about why the Live Developer Logs feature's in-memory state can't
        # safely be split across multiple Cloud Run instances yet. Raise this once that's
        # addressed (a shared backing store), not before.
