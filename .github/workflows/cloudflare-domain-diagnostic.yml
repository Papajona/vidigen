name: Cloudflare frontend domain diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-domain-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect domain DNS and Worker access
        run: |
          set -e
          ZONES="$(curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/zones?name=vidigen.online&status=active"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")"
          echo "$ZONES" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print("zone_count=",len(r)); print("zone_id=",r[0]["id"] if r else "")'
          ZONE_ID="$(echo "$ZONES" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if r else "")')"
          test -n "$ZONE_ID"

          echo "www DNS records:"
          curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.vidigen.online&per_page=100"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json" |
            python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{k:r.get(k) for k in ("id","type","name","content","proxied")} for r in d.get("result",[])],indent=2))'

          echo "root DNS records:"
          curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=vidigen.online&per_page=100"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json" |
            python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{k:r.get(k) for k in ("id","type","name","content","proxied")} for r in d.get("result",[])],indent=2))'

          echo "Worker route access:"
          ROUTES="$(curl --silent --show-error -w '\nHTTP_STATUS=%{http_code}\n'             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes?per_page=100"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json" || true)"
          echo "$ROUTES"
