name: Vidigen Live Route Diagnostic

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/vidigen-live-diagnostic.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Worker and domains
        shell: bash
        run: |
          set -u
          for URL in             "https://vidigen-ai.affuljona.workers.dev/__gateway_health?probe=diag"             "https://www.vidigen.online/__gateway_health?probe=diag"             "https://vidigen.online/__gateway_health?probe=diag"             "https://api.vidigen.online/healthz?probe=diag"             "https://www.vidigen.online/"; do
            echo "===== $URL ====="
            curl -sS -D - --max-time 20 "$URL" -o /tmp/body.txt || true
            echo "--- BODY ---"
            cat /tmp/body.txt || true
            echo
          done
