name: Deploy gateway to Cloud Run

concurrency:
  group: gateway-production-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/deploy-gateway.yml"
  workflow_dispatch: {}

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: vidigen-gateway
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vidigen/gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements.txt pytest
      - run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build image
        run: |
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" -f Dockerfile .
      - name: Push image
        run: |
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}:${{ github.sha }}" \
            --region="${REGION}" --platform=managed --allow-unauthenticated --ingress=all \
            --memory=4Gi --cpu=2 --no-cpu-throttling --concurrency=4 --timeout=900 \
            --min-instances=1 --max-instances=1 \
            --set-env-vars="^@^VIDIGEN_ALLOWED_ORIGINS=${{ secrets.VIDIGEN_ALLOWED_ORIGINS }},https://vidigen.online,https://www.vidigen.online@VIDIGEN_RATE_LIMIT=30@VIDIGEN_ADMIN_2FA_REQUIRED=true@VIDIGEN_PAYMENT_TEST_MODE=false@GOOGLE_PAY_TEST_MODE=false@VIDIGEN_PROVIDER_PRIORITY=${{ secrets.VIDIGEN_PROVIDER_PRIORITY || 'replicate,seedance,runway' }}@REPLICATE_MODEL=${{ secrets.REPLICATE_MODEL || 'bytedance/seedance-2.0' }}@REPLICATE_IMAGE_MODEL=${{ secrets.REPLICATE_IMAGE_MODEL || 'black-forest-labs/flux-schnell' }}@SEEDANCE_API_URL=${{ secrets.SEEDANCE_API_URL }}@SEEDANCE_API_TOKEN=${{ secrets.SEEDANCE_API_TOKEN }}@RUNWAY_API_URL=${{ secrets.RUNWAY_API_URL }}@RUNWAY_API_TOKEN=${{ secrets.RUNWAY_API_TOKEN }}@SEEDANCE_STATUS_URL_TEMPLATE=${{ secrets.SEEDANCE_STATUS_URL_TEMPLATE }}@RUNWAY_STATUS_URL_TEMPLATE=${{ secrets.RUNWAY_STATUS_URL_TEMPLATE }}@VIDIGEN_AGENT_JOB_TIMEOUT=900@VIDIGEN_MAX_RENDER_CLIPS=50@VIDIGEN_MAX_RENDER_BYTES=500000000@VIDIGEN_RENDER_TIMEOUT=900@VIDIGEN_RENDER_ALLOWED_HOSTS=${{ secrets.VIDIGEN_RENDER_ALLOWED_HOSTS }}@SUPABASE_URL=${{ secrets.SUPABASE_URL }}@SUPABASE_JWT_ISSUER=${{ secrets.SUPABASE_URL }}/auth/v1@R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}@R2_BUCKET=${{ secrets.R2_BUCKET }}@R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}@VIDIGEN_BILLING_CURRENCY=GHS@GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}@GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}@VIDIGEN_BILLING_ENFORCE=true" \
            --set-secrets="VIDIGEN_GATEWAY_TOKEN=vidigen-gateway-token:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,REPLICATE_API_TOKEN=replicate-api-token:latest,PAYSTACK_SECRET_KEY=paystack-secret-key:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,GROQ_API_KEY=groq-api-key:latest" 2>&1 | tee deploy.log
          DEPLOYED_URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format="value(status.url)")
          test -n "$DEPLOYED_URL"
          echo "deployed_url=$DEPLOYED_URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed gateway
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployed_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$DEPLOYED_URL/docs" >/dev/null
          echo "Cloud Run gateway: OK"
