name: One-time verify API custom domain

on:
  push:
    paths:
      - ".github/workflows/verify-api-domain.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify api.vidigen.online reaches FastAPI
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --retry 8 --retry-delay 3 -o /tmp/api-docs.html -w "%{http_code}" https://api.vidigen.online/docs)"
          echo "HTTP_CODE=$code"
          echo "RESPONSE_HEAD:"
          head -c 1200 /tmp/api-docs.html || true
          echo
          test "$code" = "200"
          grep -qi "FastAPI" /tmp/api-docs.html
          echo "API_CUSTOM_DOMAIN_VERIFIED"
          echo "https://api.vidigen.online is serving the production FastAPI gateway."
