name: Diagnose Vidigen Cloudflare DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cloudflare-dns.yml"\n      - "worker.js"\n      - "wrangler.jsonc"
  workflow_dispatch: {}

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public DNS
        shell: bash
        run: |
          set -euo pipefail
          for HOST in vidigen.online www.vidigen.online api.vidigen.online; do
            echo "=== $HOST ==="
            echo "system resolver:"
            getent ahosts "$HOST" || true
            echo "Cloudflare DoH:"
            curl -fsS -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=ANY"               | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"Status":d.get("Status"),"Answer":d.get("Answer",[])},indent=2))'
            echo "Google DoH:"
            curl -fsS "https://dns.google/resolve?name=$HOST&type=ANY"               | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"Status":d.get("Status"),"Answer":d.get("Answer",[])},indent=2))'
          done

      - name: Verify public endpoints
        shell: bash
        run: |
          set -u
          for URL in             "https://www.vidigen.online/"             "https://www.vidigen.online/__gateway_health"             "https://api.vidigen.online/healthz"; do
            echo "=== $URL ==="
            curl -I -sS --max-time 15 "$URL" | head -n 12 || true
          done
