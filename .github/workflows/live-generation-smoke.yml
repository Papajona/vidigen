name: One-time live generation smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-generation-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ secrets.GCP_REGION }}
      SERVICE: vidigen-gateway
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify gateway and configured provider
        run: |
          GATEWAY_TOKEN="$(gcloud secrets versions access latest --secret=vidigen-gateway-token)"
          BASE_URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"
          test -n "$BASE_URL"
          curl --fail --silent --show-error             -H "Authorization: Bearer $GATEWAY_TOKEN"             "$BASE_URL/health"
          echo
          PROVIDERS="$(curl --fail --silent --show-error             -H "Authorization: Bearer $GATEWAY_TOKEN"             "$BASE_URL/api/providers")"
          echo "$PROVIDERS"
          export PROVIDERS
          python - <<'PY'
          import json, os
          data=json.loads(os.environ["PROVIDERS"])
          configured=[p["key"] for p in data.get("providers",[]) if p.get("capability")=="video" and p.get("configured")]
          if not configured:
              raise SystemExit("No configured live video provider is available.")
          print("Configured live video providers:", ", ".join(configured))
          PY

      - name: Submit and poll real generation
        run: |
          GATEWAY_TOKEN="$(gcloud secrets versions access latest --secret=vidigen-gateway-token)"
          BASE_URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"
          KEY="ci-live-smoke-${GITHUB_SHA}"

          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: Bearer $GATEWAY_TOKEN"             -H "Content-Type: application/json"             -X POST "$BASE_URL/api/generate"             -d "{"prompt":"A simple cinematic blue studio product shot with a slow camera push-in and clean lighting.","mode":"Text → Video","ratio":"16:9","duration":"4s","model":"auto","idempotencyKey":"$KEY","tags":["ci-smoke"]}")"

          echo "$RESPONSE" > /tmp/generation.json
          cat /tmp/generation.json
          PROMPT_ID="$(python - <<'PY'
          import json
          print(json.load(open("/tmp/generation.json")).get("promptId") or "")
          PY
          )"
          test -n "$PROMPT_ID"

          for i in $(seq 1 120); do
            STATUS="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GATEWAY_TOKEN"               "$BASE_URL/api/status/$PROMPT_ID")"
            echo "$STATUS"
            python - "$STATUS" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          if d.get("videoUrl") or d.get("outputUrl"):
              print("LIVE_GENERATION_OK")
              raise SystemExit(0)
          if d.get("status")=="error":
              print(d.get("error") or "Generation failed.", file=sys.stderr)
              raise SystemExit(2)
          raise SystemExit(1)
          PY
            code=$?
            [ "$code" -eq 0 ] && exit 0
            [ "$code" -eq 2 ] && exit 1
            sleep 5
          done
          exit 1
