name: One-time live paid generation

on:
  push:
    paths:
      - ".github/workflows/live-paid-generation.yml"

jobs:
  live_generation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GCP_REGION: ${{ secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare production credentials
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_SERVICE_ROLE_KEY="$(gcloud secrets versions access latest --secret=supabase-service-role-key)"
          GATEWAY_URL="$(gcloud run services describe vidigen-gateway --region="$GCP_REGION" --format="value(status.url)")"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GATEWAY_URL"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "GATEWAY_URL=$GATEWAY_URL" >> "$GITHUB_ENV"

      - name: Execute one real production generation
        shell: bash
        run: |
          set -euo pipefail

          USER_ID=""
          cleanup() {
            set +e
            if [ -n "$USER_ID" ]; then
              for table in credit_transactions generation_jobs credit_wallets subscriptions payments payment_events; do
                curl --silent --show-error --fail-with-body -X DELETE                   "$SUPABASE_URL/rest/v1/$table?user_id=eq.$USER_ID"                   -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"                   -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"                   -H "Prefer: return=minimal" >/tmp/cleanup-$table.log 2>&1 || true
              done
              curl --silent --show-error --fail-with-body -X DELETE                 "$SUPABASE_URL/auth/v1/admin/users/$USER_ID"                 -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"                 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"                 >/tmp/cleanup-user.log 2>&1 || true
            fi
          }
          trap cleanup EXIT

          TS="$(date +%s)"
          EMAIL="vidigen-live-smoke-$TS@example.com"
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"

          echo "Creating disposable confirmed Supabase smoke user..."
          curl --silent --show-error --fail-with-body             -X POST "$SUPABASE_URL/auth/v1/admin/users"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             --data "{"email":"$EMAIL","password":"$PASSWORD","email_confirm":true}"             > /tmp/create-user.json

          USER_ID="$(jq -r '.id' /tmp/create-user.json)"
          test -n "$USER_ID" && test "$USER_ID" != "null"

          echo "Signing in to obtain a real Supabase access token..."
          curl --silent --show-error --fail-with-body             -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password"             -H "apikey: $SUPABASE_ANON_KEY"             -H "Content-Type: application/json"             --data "{"email":"$EMAIL","password":"$PASSWORD"}"             > /tmp/session.json

          ACCESS_TOKEN="$(jq -r '.access_token' /tmp/session.json)"
          test -n "$ACCESS_TOKEN" && test "$ACCESS_TOKEN" != "null"
          echo "::add-mask::$ACCESS_TOKEN"

          echo "Reading the current production credit price..."
          PRICE="$(curl --silent --show-error --fail-with-body             "$SUPABASE_URL/rest/v1/ai_model_prices?model_key=eq.bytedance%2Fseedance-2.0&operation=eq.video&select=credits_per_5s&limit=1"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[0].credits_per_5s // 110')"
          case "$PRICE" in
            ''|*[!0-9]*) echo "Invalid production credit price: $PRICE"; exit 1 ;;
          esac
          echo "5-second production price: $PRICE credits"

          echo "Funding exactly one production generation..."
          curl --silent --show-error --fail-with-body             -X POST "$SUPABASE_URL/rest/v1/credit_wallets?on_conflict=user_id"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -H "Prefer: resolution=merge-duplicates,return=representation"             --data "{"user_id":"$USER_ID","balance":$PRICE,"monthly_allowance":$PRICE}"             > /tmp/wallet.json

          IDEMPOTENCY_KEY="live-smoke-$TS-$(openssl rand -hex 8)"
          PROMPT="Create a premium cinematic 5-second product showcase for Vidigen AI: a sleek futuristic device on a clean studio table, controlled camera push-in, realistic materials, soft cinematic lighting, polished commercial finish, no text or logos."

          PAYLOAD="$(jq -n             --arg prompt "$PROMPT"             --arg key "$IDEMPOTENCY_KEY"             '{
              prompt:$prompt,
              mode:"Text → Video",
              ratio:"16:9",
              duration:"5s",
              scene:{duration:5,prompt:$prompt,camera:"Slow push in"},
              sourceUrl:null,
              model:"replicate",
              tags:["live-smoke","production","cinematic"],
              idempotencyKey:$key
            }')"

          echo "Submitting one REAL production generation through Replicate..."
          curl --silent --show-error --fail-with-body             -X POST "$GATEWAY_URL/api/generate"             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$PAYLOAD"             > /tmp/generate.json

          PROMPT_ID="$(jq -r '.promptId // empty' /tmp/generate.json)"
          PROVIDER="$(jq -r '.provider // empty' /tmp/generate.json)"
          test -n "$PROMPT_ID" && test "$PROMPT_ID" != "null"
          echo "Accepted: provider=$PROVIDER job=$PROMPT_ID"

          OUTPUT_URL=""
          FINAL_STATUS=""
          for i in $(seq 1 90); do
            sleep 10
            curl --silent --show-error --fail-with-body               "$GATEWAY_URL/api/status/$PROMPT_ID"               -H "Authorization: Bearer $ACCESS_TOKEN"               > /tmp/status.json

            FINAL_STATUS="$(jq -r '.status // empty' /tmp/status.json)"
            OUTPUT_URL="$(jq -r '.videoUrl // .outputUrl // empty' /tmp/status.json)"

            if [ -n "$OUTPUT_URL" ]; then
              break
            fi
            if [ "$FINAL_STATUS" = "error" ]; then
              cat /tmp/status.json
              exit 1
            fi
            echo "Poll $i/90: status=$FINAL_STATUS"
          done

          test -n "$OUTPUT_URL"
          echo "Verifying generated media output..."
          curl --silent --show-error --fail --location --range 0-0             -o /tmp/generated-probe             "$OUTPUT_URL"
          test -s /tmp/generated-probe

          echo "LIVE_GENERATION_VERIFIED"
          echo "provider=$PROVIDER"
          echo "credits_used=$PRICE"
          echo "job_id=$PROMPT_ID"
          echo "output_url=$OUTPUT_URL"
