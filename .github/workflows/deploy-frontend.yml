# Frontend deployment for Vidigen AI
name: Deploy frontend to Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "wrangler.jsonc"
      - "worker.js"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Validate production configuration
        env:
          VITE_VIDIGEN_GATEWAY_URL: ${{ secrets.VITE_VIDIGEN_GATEWAY_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_VIDIGEN_GATEWAY_URL" || { echo "::error::Missing VITE_VIDIGEN_GATEWAY_URL"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }

      - run: npm ci
      - run: npm test

      - name: Build production frontend
        env:
          VITE_VIDIGEN_GATEWAY_URL: ${{ secrets.VITE_VIDIGEN_GATEWAY_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Deploy frontend to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
          
      - name: Verify production Worker and API edge
        shell: bash
        run: |
          set -u
          echo "Verifying production frontend..."
          curl --fail --silent --show-error --retry 8 --retry-delay 3             https://www.vidigen.online/ >/dev/null
          echo "www.vidigen.online frontend: OK"

          echo "Verifying API edge..."
          curl --fail --silent --show-error --retry 8 --retry-delay 3             https://api.vidigen.online/docs >/dev/null
          echo "api.vidigen.online: OK"

          echo "Verifying same-origin gateway health through www..."
          curl --fail --silent --show-error --retry 8 --retry-delay 3             https://www.vidigen.online/__gateway_health >/dev/null
          echo "www.vidigen.online gateway health: OK"

          for host in vidigen.online www.vidigen.online; do
            if getent ahosts "$host" >/dev/null 2>&1; then
              echo "DNS exists for $host; checking HTTP..."
              if curl --fail --silent --show-error --retry 3 --retry-delay 2 "https://$host/" >/dev/null; then
                echo "$host: OK"
              else
                echo "::warning::$host resolves but the HTTP endpoint is not serving the frontend yet."
              fi
            else
              echo "::warning::$host has no public DNS record yet. Add it as a Cloudflare Worker custom domain for vidigen-ai."
            fi
          done
