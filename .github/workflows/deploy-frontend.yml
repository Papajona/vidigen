# Frontend deployment for Vidigen AI
name: Deploy frontend to Cloudflare Worker

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "wrangler.jsonc"
      - "worker.js"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Validate production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Build production frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build
      - name: Deploy frontend to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify production Worker and API edge
        shell: bash
        run: |
          set -u
          curl --fail --silent --show-error --retry 8 --retry-delay 3 https://www.vidigen.online/ >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 3 https://api.vidigen.online/docs >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "https://vidigen-gateway-xvpegaghzq-uc.a.run.app/docs?probe=github" >/dev/null
          for host in vidigen.online www.vidigen.online; do
            if getent ahosts "$host" >/dev/null 2>&1; then
              if ! curl --fail --silent --show-error --retry 3 --retry-delay 2 "https://$host/" >/dev/null; then
                echo "::warning::$host resolves but the HTTP endpoint is not serving the frontend yet."
              fi
            else
              echo "::warning::$host has no public DNS record yet. Add it as a Cloudflare Worker custom domain for vidigen-ai."
            fi
          done
